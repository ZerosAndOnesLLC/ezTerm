name: ci

# Pull-request checks only; nothing here builds a release or produces
# artifacts (release.yml does that when a GitHub release is published).
# Independent jobs so a UI lint failure doesn't hide a Rust test failure
# (and vice versa), each gated on the paths it covers:
#
#   rust   — cargo fmt --check, clippy (advisory), tests (warnings are errors)
#   audit  — cargo audit against the RustSec database (.cargo/audit.toml
#            lists the accepted, unfixable advisories)
#   ui     — typecheck, lint, unit tests
#   site   — unit tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A new push to the same PR cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - '.github/workflows/ci.yml'
            site:
              - 'site/**'
              - 'docs/release-notes/**'
              - '.github/workflows/ci.yml'

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One RUSTFLAGS for every cargo step so they share one dependency
      # build (and one rust-cache entry). Warnings are errors, matching the
      # repo rule that the code must build warning-free before every commit.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      # Tauri's generate_context! embeds `frontendDist` (../ui/out) at
      # compile time and fails if the directory is missing. This job never
      # runs the UI, so an empty stub stands in for the Next.js export.
      - name: Stub frontendDist (ui/out)
        run: mkdir -p ui/out

      # Same set as release.yml: webkit2gtk 4.1 plus the desktop libs the
      # tauri / wry / gtk crates link against.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl wget file xz-utils patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Clippy lints are advisory for now (--cap-lints warn): the codebase
      # has a backlog of lint hits that are being worked down separately.
      # Once it is clean, drop `--cap-lints warn` to make it blocking.
      # Compiler warnings still fail the job through `cargo test` below.
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- --cap-lints warn

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reads .cargo/audit.toml for the ignore list. Fails on any new
      # vulnerability; unmaintained / unsound notices stay warnings.
      - name: cargo audit
        run: cargo audit

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm --prefix ui ci

      - name: Typecheck
        run: npm --prefix ui run typecheck

      - name: Lint
        run: npm --prefix ui run lint

      - name: Test
        run: npm --prefix ui test

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm --prefix site ci

      - name: Test
        run: npm --prefix site test
