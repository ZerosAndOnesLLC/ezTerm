# cargo-audit policy for CI (see .github/workflows/ci.yml).
[advisories]
ignore = [
  # rsa: Marvin timing side-channel. Pulled in transitively by russh; no
  # patched release exists upstream. Re-check when bumping russh.
  "RUSTSEC-2023-0071",
  # libsqlite3-sys < 0.39: bundled SQLite < 3.54 can return uninitialized
  # page-cache memory when opening a db with a mismatched-page-size -wal
  # written by a less trusted party. Pulled in by sqlx-sqlite 0.9.0, which
  # caps libsqlite3-sys at < 0.38. ezTerm only opens its own db in the
  # per-user app-data dir (backups are encrypted JSON, never opened as
  # SQLite), so no untrusted db/-wal pair is reachable. Remove once sqlx
  # allows libsqlite3-sys >= 0.39.
  "RUSTSEC-2026-0459",
]
